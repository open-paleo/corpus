[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "open-paleo-corpus"
version = "0.1.0"
description = "Local archive and search index for the papers an open-paleo data repository cites"
requires-python = ">=3.11"
dependencies = [
  "pypdfium2>=4.30,<5",
  "pikepdf>=9,<11",
  "img2pdf>=0.5,<0.7",
  "pillow>=10,<12",
  "python-dotenv>=1,<2",
  "pyyaml>=6,<7",
  # Word frequencies for the dropped-ligature repair on a small corpus (code
  # Apache-2.0, data CC-BY-SA 4.0).
  "wordfreq>=3,<4",
]

[project.optional-dependencies]
# Claude vision OCR, translation and the specimen-ID scan.
vision = ["anthropic>=0.46,<1", "numpy>=1.26,<3"]
# Text-layer conversion. marker-pdf is GPL-3.0 and installs torch (several GB).
marker = ["marker-pdf>=1.10,<2"]
# corpus web: the server, markdown rendering, and the sanitiser for its HTML.
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "markdown2>=2.5,<3", "nh3>=0.2,<1"]
lang = ["langdetect>=1.0.9,<2"]
images = ["pillow-heif>=0.20,<1", "numpy>=1.26,<3"]
doc = ["markdownify>=0.13,<2"]
# Optional PDF_BACKEND=pymupdf, kept for comparing backends. AGPL; off by default.
pymupdf = ["pymupdf>=1.24"]
all = ["open-paleo-corpus[vision,web,lang,images,doc]"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
corpus = "corpus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/corpus"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pyflakes (undefined names, unused imports/variables) and syntax errors: what
# the codebase passes today. Style rules (E, W, I, B, UP) are a later pass.
select = ["F", "E9"]
ignore = ["F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = "-p no:anyio"
