name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (core + web + dev; no marker or vision)
        run: pip install -e ".[web,dev]" httpx
      - name: Lint
        run: ruff check scripts src tests
      - name: Tests
        run: pytest -q
      # The web app's browser code (src/corpus/web/static/): the open-paleo
      # ESLint rules and a JSDoc type check. Node is a development tool only.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install web tools
        run: npm ci
      - name: Lint web code
        run: npm run lint
      - name: Type-check web code
        run: npm run typecheck
